name: Screenshot Check

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screenshots:
    name: Emulator screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download latest successful debug APK
        run: |
          RUN_ID=$(gh run list --workflow "CI & Debug Build" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Using APK from run $RUN_ID"
          gh run download "$RUN_ID" --name app-universal-foss-debug --dir apkdir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash -c "curl -sL https://raw.githubusercontent.com/asifbiswas96/Melody/main/tools/ci_screenshots.sh -o /tmp/ci_screenshots.sh && bash /tmp/ci_screenshots.sh"
