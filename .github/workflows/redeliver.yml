name: Redeliver Debug APK

# Recovery workflow: takes the already-built debug APK artifact from a previous
# run, uploads it to Gofile from an owner account, sets the folder public, and
# verifies a non-owner can list it. No rebuild.
# If folder_id is given, skips download/upload and only verifies that folder.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source run ID whose app-universal-foss-debug artifact to redeliver'
        required: true
        default: '43795337795'
      folder_id:
        description: 'Existing Gofile folder id to verify only (skips upload)'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  redeliver:
    name: Rehost APK with verified public link
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from source run
        if: ${{ github.event.inputs.folder_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: app-universal-foss-debug
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Upload to Gofile and publish folder
        if: ${{ github.event.inputs.folder_id == '' }}
        run: |
          set -euo pipefail
          APK=$(ls apk/*.apk | head -1)
          LOCAL_MD5=$(md5sum "$APK" | awk '{print $1}')
          echo "local apk: $(basename "$APK") md5=$LOCAL_MD5"

          # owner account for this upload; token stays in this shell, masked, never printed
          ACCT=$(curl -sS -X POST https://api.gofile.io/accounts)
          TOKEN=$(jq -r '.data.token // empty' <<<"$ACCT")
          [ -n "$TOKEN" ] || { echo "::error::could not create owner account"; exit 1; }
          echo "::add-mask::${TOKEN}"

          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESP=$(curl -sS --retry 3 -H "Authorization: Bearer ${TOKEN}" \
                 -F "file=@${APK}" "https://${SERVER}.gofile.io/contents/uploadfile")
          [ "$(jq -r .status <<<"$RESP")" = "ok" ] || { echo "::error::upload failed"; exit 1; }
          PAGE=$(jq -r '.data.downloadPage' <<<"$RESP")
          FOLDER=$(jq -r '.data.parentFolder' <<<"$RESP")
          RMD5=$(jq -r '.data.md5 // empty' <<<"$RESP")
          echo "UPLOADED_PAGE=${PAGE}" >> "$GITHUB_ENV"
          echo "UPLOADED_FOLDER=${FOLDER}" >> "$GITHUB_ENV"
          echo "downloadPage: ${PAGE}"
          echo "remote md5: ${RMD5}"
          [ -z "$RMD5" ] || [ "$RMD5" = "$LOCAL_MD5" ] || { echo "::error::md5 mismatch"; exit 1; }

          UPD=$(curl -sS -X PUT "https://api.gofile.io/contents/${FOLDER}/update" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"attribute":"public","attributeValue":"true"}')
          [ "$(jq -r .status <<<"$UPD")" = "ok" ] || { echo "::error::set-public failed"; jq -r .status <<<"$UPD"; exit 1; }
          echo "folder set public: ok"

      - name: Verify anonymous access
        run: |
          set -uo pipefail
          FOLDER="${{ github.event.inputs.folder_id }}"
          PAGE=""
          if [ -z "$FOLDER" ]; then
            FOLDER="${UPLOADED_FOLDER:-}"
            PAGE="${UPLOADED_PAGE:-}"
          else
            PAGE="https://gofile.io/d/${FOLDER}"
          fi
          if [ -z "$FOLDER" ]; then echo "::error::no folder to verify"; exit 1; fi
          echo "verifying folder: ${FOLDER}"

          # Anonymous route used by gofile's own web frontend: the public
          # websiteToken (embedded in their JS, no account). Account tokens get
          # error-notPremium on this endpoint, so this is the correct probe.
          RESP=""
          try_token () {
            local WT="$1" R S
            R=$(curl -sS "https://api.gofile.io/contents/${FOLDER}" -H "X-Website-Token: ${WT}" -H "Referer: https://gofile.io/" 2>/dev/null || true)
            S=$(jq -r .status <<<"$R" 2>/dev/null || echo error)
            echo "  header token ${WT}: ${S}"
            if [ "$S" = "ok" ]; then RESP="$R"; return 0; fi
            R=$(curl -sS "https://api.gofile.io/contents/${FOLDER}?websiteToken=${WT}" -H "Referer: https://gofile.io/" 2>/dev/null || true)
            S=$(jq -r .status <<<"$R" 2>/dev/null || echo error)
            echo "  param token ${WT}: ${S}"
            if [ "$S" = "ok" ]; then RESP="$R"; return 0; fi
            return 1
          }

          # gofile's long-standing public anonymous websiteToken first
          if ! try_token "4fd6sg89d7s6"; then
            echo "known public token failed; scraping frontend bundle for current websiteToken"
            WT2=""
            for url in $(curl -s https://gofile.io/ | grep -oE '"[^"]*\.js[^"]*"' | tr -d '"' | sort -u || true); do
              case "$url" in /*) url="https://gofile.io${url}";; http*) :;; *) continue;; esac
              CAND=$(curl -s "$url" | grep -oE 'websiteToken["'"'"']?[:=]["'"'"'][A-Za-z0-9]+' | grep -oE '[A-Za-z0-9]+$' | head -1 || true)
              if [ -n "$CAND" ]; then WT2="$CAND"; echo "extracted websiteToken from ${url}"; break; fi
            done
            if [ -n "$WT2" ]; then try_token "$WT2" || true; fi
          fi
          if [ -z "$RESP" ]; then echo "::error::anonymous listing failed with every token"; exit 1; fi

          LISTING=$(jq -r '.data.children[] | "\(.name) | \(.size) bytes | md5 \(.md5 // "n/a") | type \(.type)"' <<<"$RESP" 2>/dev/null || true)
          echo "anonymous visitor sees:"
          echo "$LISTING"
          echo "$LISTING" | grep -q '\.apk' || { echo "::error::apk not visible anonymously"; exit 1; }

          {
            echo "### Melody Debug APK (verified public)"
            echo "Gofile: ${PAGE}"
            echo "Anonymous listing verified: yes"
            echo "${LISTING}"
          } >> "$GITHUB_STEP_SUMMARY"
